[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mirage-lineaments"
version = "1.3.0"
description = "Reproducible raster lineament extraction without geological origin inference"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE.txt"]
authors = [{name = "Jordan Zavaleta"}]
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "scikit-image>=0.22,<0.27", "shapely>=2,<3", "pyproj>=3.6,<4"]

[project.optional-dependencies]
io = ["rasterio>=1.3,<2", "geopandas>=0.14,<2", "fiona>=1.9,<2"]
wavelets = ["PyWavelets>=1.6,<2"]
nn = ["onnxruntime>=1.18,<2"]
gui = ["rasterio>=1.3,<2", "geopandas>=0.14,<2", "fiona>=1.9,<2", "pillow>=10,<14"]
dev = ["pytest>=8,<10", "ruff>=0.8,<1", "build>=1,<2", "harmonica>=0.7,<0.8", "matplotlib>=3.8,<4"]

[project.urls]
Repository = "https://github.com/jordan-zav/MIRAGE"
Issues = "https://github.com/jordan-zav/MIRAGE/issues"

[project.scripts]
mirage = "mirage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mirage", "mirage.*"]

[tool.setuptools.package-data]
mirage = ["assets/branding/*.png", "geophysics_calibration.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]
