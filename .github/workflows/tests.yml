name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python-tests:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and development extras
        run: python -m pip install -e ".[dev,wavelets,nn,io]"
      - name: Ruff
        run: python -m ruff check src tests mirage_qgis scripts setup.py
      - name: Pytest
        run: python -B -m pytest
